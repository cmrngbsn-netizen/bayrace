<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BayRace">
<meta name="theme-color" content="#0b2a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
<title>BayRace</title>
</head>
<body>
<div id="map"></div>
<div id="status" hidden></div>
<button id="locate" aria-label="My location">◎</button>
<button id="condbtn" type="button" hidden>Tides &amp; Wind</button>
<section id="cond" hidden aria-label="Tides and Wind">
 <header><h2>Tides &amp; Wind</h2><button id="condclose" type="button" aria-label="Close">×</button></header>
 <div id="condwhen"></div>
 <div id="condplaces" role="group" aria-label="Place on the course"></div>
 <div id="condbody"></div>
</section>
<div id="coursebar" hidden><div class="cbrow"><select id="course" aria-label="Course"></select><button id="play" type="button" hidden aria-label="Sail the course">▶</button></div><div id="summary"></div></div>
<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
<script src="land.js"></script>
<script src="courses.js"></script>
<script src="conditions.js"></script>
</body>
</html>
