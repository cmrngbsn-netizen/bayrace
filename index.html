<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BayRace">
<meta name="theme-color" content="#0b2a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
<title>BayRace</title>
</head>
<body>
<div id="map"></div>
<div id="status" hidden></div>
<section id="cond" hidden aria-label="Tides and Wind">
 <header><h2>Tides &amp; Wind</h2><button id="condclose" class="btn alt icon" type="button" aria-label="Close">×</button></header>
 <div id="condwhen"></div>
 <div id="condplaces" role="group" aria-label="Place on the course"></div>
 <div id="condbody"></div>
</section>
<!-- every control lives in this one card at the bottom, so the map above stays clear -->
<div id="dock">
 <div id="layers" hidden role="group" aria-label="Map layers"></div>
 <div id="coursebar" hidden><div class="cbrow"><select id="event" aria-label="Event"></select><select id="course" aria-label="Course"></select><button id="play" class="btn icon" type="button" hidden aria-label="Sail the course">▶</button></div><div id="summary"></div></div>
 <div class="tools">
  <button id="condbtn" class="btn" type="button" hidden>Tides &amp; Wind</button>
  <button id="layerbtn" class="btn" type="button" aria-expanded="false">Layers</button>
  <button id="locate" class="btn icon" type="button" aria-label="My location">◎</button>
 </div>
</div>
<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
<script src="land.js"></script>
<script src="courses.js"></script>
<script src="conditions.js"></script>
</body>
</html>
